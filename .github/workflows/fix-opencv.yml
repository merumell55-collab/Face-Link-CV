name: Switch to lightweight mobile tracker

on:
  push:
    paths:
      - '.github/workflows/fix-opencv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace OpenCV loader
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<script async src="./opencv.js?v=4101" onload="onOpenCvScriptLoaded()" onerror="onOpenCvScriptError()"></script>'
          new = '<script src="./light-tracker.js?v=2"></script>'
          if old not in s:
              raise SystemExit('OpenCV loader not found')
          s = s.replace(old, new)
          s = s.replace('<span>OpenCV.js</span>', '<span>軽量トラッカー</span>')
          p.write_text(s, encoding='utf-8')
          PY
          rm -f opencv.js

      - name: Commit lightweight loader
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A index.html opencv.js
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Use lightweight tracker instead of OpenCV'
            git push
          fi