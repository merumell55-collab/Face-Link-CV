name: Switch to lightweight mobile tracker

on:
  push:
    paths:
      - '.github/workflows/fix-opencv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove OpenCV and install lightweight tracker
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('顔AIは使わず、OpenCV.jsのOptical Flowで自分の顔のポイントを追跡し、', '顔AIもOpenCVも使わず、スマホ向けの軽量トラッカーで自分の顔のポイントを追跡し、')
          s = s.replace('<div class="diagRow"><span>OpenCV.js</span><b id="cvDiag">読み込み中</b></div>', '<div class="diagRow"><span>軽量トラッカー</span><b id="cvDiag">準備完了</b></div>')
          s = s.replace('cvReady: false,', 'cvReady: true,')
          s = s.replace('els.startTrackBtn.textContent = "OpenCV準備待ち…";', 'els.startTrackBtn.textContent = "トラッカー準備待ち…";')

          pattern = re.compile(r'function cleanupCV\(\) \{.*?\n\}\n\nfunction startUiLoop\(\) \{', re.S)
          replacement = r'''function cleanupTracker() {
            state.trackerCanvas = null;
            state.trackerCtx = null;
            state.prevGray = null;
            state.trackerW = 0;
            state.trackerH = 0;
            state.trackLastTs = 0;
          }

          function captureGrayFrame() {
            const ctx = state.trackerCtx;
            const w = state.trackerW, h = state.trackerH;
            ctx.drawImage(els.video, 0, 0, w, h);
            const rgba = ctx.getImageData(0, 0, w, h).data;
            const gray = new Uint8Array(w * h);
            for (let i = 0, j = 0; i < rgba.length; i += 4, j++) {
              gray[j] = (rgba[i] * 77 + rgba[i + 1] * 150 + rgba[i + 2] * 29) >> 8;
            }
            return gray;
          }

          function trackOnePoint(prev, curr, px, py, w, h) {
            const patchR = 3;
            const searchR = 7;
            const x0 = Math.round(px), y0 = Math.round(py);
            if (x0 < patchR + searchR || y0 < patchR + searchR ||
                x0 >= w - patchR - searchR || y0 >= h - patchR - searchR) {
              return {x:px, y:py};
            }

            let bestScore = Infinity;
            let bestX = x0, bestY = y0;
            for (let dy = -searchR; dy <= searchR; dy++) {
              for (let dx = -searchR; dx <= searchR; dx++) {
                let score = 0;
                const cx = x0 + dx, cy = y0 + dy;
                for (let py2 = -patchR; py2 <= patchR; py2++) {
                  const prow = (y0 + py2) * w;
                  const crow = (cy + py2) * w;
                  for (let px2 = -patchR; px2 <= patchR; px2++) {
                    score += Math.abs(prev[prow + x0 + px2] - curr[crow + cx + px2]);
                  }
                }
                if (score < bestScore) {
                  bestScore = score;
                  bestX = cx;
                  bestY = cy;
                }
              }
            }
            if (bestScore / 49 > 42) return {x:px, y:py};
            return {x:bestX, y:bestY};
          }

          function initTracking() {
            cleanupTracker();
            const vw = els.video.videoWidth, vh = els.video.videoHeight;
            const maxW = 320;
            const scale = Math.min(1, maxW / vw);
            state.trackerW = Math.max(160, Math.round(vw * scale));
            state.trackerH = Math.max(120, Math.round(vh * scale));
            state.trackerCanvas = document.createElement("canvas");
            state.trackerCanvas.width = state.trackerW;
            state.trackerCanvas.height = state.trackerH;
            state.trackerCtx = state.trackerCanvas.getContext("2d", {willReadFrequently:true});
            state.prevGray = captureGrayFrame();
            state.currentCamPoints = state.camPoints.map(p => ({...p}));
            state.smoothedCamPoints = state.camPoints.map(p => ({...p}));
            state.neutralCamPoints = state.camPoints.map(p => ({...p}));
            state.trackLastTs = 0;
          }

          function startTracking() {
            if (!state.stream || state.photoPoints.length !== 11 || state.camPoints.length !== 11) return;
            buildMesh();
            initTracking();
            state.tracking = true;
            updateButtons();
            setStatus("表情リンク中です。スマホ向け軽量トラッカーで目・口・眉の動きを追跡しています。", "ok");
            state.trackRaf = requestAnimationFrame(trackLoop);
          }

          function stopTracking() {
            state.tracking = false;
            cancelAnimationFrame(state.trackRaf);
            cleanupTracker();
            if (state.photoImg) renderPhotoBase(true);
            if (state.stream) renderCamBase();
            updateButtons();
          }

          function trackLoop(ts) {
            if (!state.tracking) return;
            if (state.trackLastTs && ts - state.trackLastTs < 70) {
              state.trackRaf = requestAnimationFrame(trackLoop);
              return;
            }
            state.trackLastTs = ts;
            try {
              const currGray = captureGrayFrame();
              const sx = state.trackerW / els.video.videoWidth;
              const sy = state.trackerH / els.video.videoHeight;
              const raw = [];
              for (let i = 0; i < state.currentCamPoints.length; i++) {
                const p = state.currentCamPoints[i];
                const q = trackOnePoint(state.prevGray, currGray, p.x * sx, p.y * sy, state.trackerW, state.trackerH);
                raw.push({x:q.x / sx, y:q.y / sy});
              }
              state.currentCamPoints = raw;
              const alpha = Math.max(0.08, 1 - Number(els.smooth.value) / 100);
              state.smoothedCamPoints = state.smoothedCamPoints.map((p, i) => ({
                x: p.x + (state.currentCamPoints[i].x - p.x) * alpha,
                y: p.y + (state.currentCamPoints[i].y - p.y) * alpha
              }));
              state.prevGray = currGray;
              renderPhotoWarp();
              renderCamBase();
            } catch (e) {
              console.error(e);
              stopTracking();
              setStatus("追跡中にエラーが発生しました。カメラ側のポイントを設定し直してください。", "bad");
              return;
            }
            state.trackRaf = requestAnimationFrame(trackLoop);
          }

          function startUiLoop() {'''
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1:
            raise SystemExit(f'tracker block replacement failed: {n}')

          tail = re.compile(r'function markCvReady\(candidate = null\) \{.*?startUiLoop\(\);\n</script>\n<script async src="\./opencv\.js\?v=4101" onload="onOpenCvScriptLoaded\(\)" onerror="onOpenCvScriptError\(\)"></script>', re.S)
          new_tail = '''state.cvReady = true;\nupdateDiagnostics();\nupdateButtons();\nsetDiag(els.cvDiag, "準備完了", "good");\nsetStatus("軽量トラッカーの準備が完了しました。写真とカメラの11点を登録してください。", "ok");\ninitEvents();\nstartUiLoop();\n</script>'''
          s, n = tail.subn(new_tail, s, count=1)
          if n != 1:
            raise SystemExit(f'OpenCV tail replacement failed: {n}')

          s = re.sub(r'\n\s*loupeCtx\.save\(\);\s*\n\s*loupeCtx\.beginPath\(\);\s*\n\s*loupeCtx\.arc\(60,60,60,0,Math\.PI\*2\);\s*\n\s*loupeCtx\.clip\(\);\s*\n\s*loupeCtx\.drawImage\(canvas, srcPos\.x \? 0 : 0, 0\); // dummy call not used\s*\n\s*loupeCtx\.restore\(\);\s*\n', '\n', s)

          p.write_text(s, encoding='utf-8')
          PY

          rm -f opencv.js

      - name: Commit lightweight version
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A index.html opencv.js
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Replace OpenCV with lightweight mobile tracker'
            git push
          fi