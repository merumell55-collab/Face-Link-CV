name: Unpack Face Link HTML

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack embedded HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, base64, gzip
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          m = re.search(r'atob\("([A-Za-z0-9+/=]+)"\)', s)
          if not m:
              print('index.html is already plain HTML')
              raise SystemExit(0)
          html = gzip.decompress(base64.b64decode(m.group(1))).decode('utf-8')
          p.write_text(html, encoding='utf-8')
          print('Unpacked index.html:', len(html), 'bytes')
          PY
      - name: Commit unpacked HTML
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Replace compressed loader with plain HTML"
          git push

# trigger unpack
