name: Build Plain Face Link HTML

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert embedded compressed app to plain index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, base64, gzip

          src = Path('compressed.html')
          if not src.exists():
              raise SystemExit('compressed.html not found')

          s = src.read_text(encoding='utf-8')
          m = re.search(r'atob\("([A-Za-z0-9+/=]+)"\)', s)
          if not m:
              raise SystemExit('embedded gzip payload not found')

          raw = base64.b64decode(m.group(1))
          html = gzip.decompress(raw).decode('utf-8')
          Path('index.html').write_text(html, encoding='utf-8')
          print('Wrote plain index.html:', len(html), 'bytes')
          PY
      - name: Commit plain index.html
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already plain and current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Deploy plain Face Link HTML"
          git push
