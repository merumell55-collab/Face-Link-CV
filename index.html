<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><title>Face Link CV</title><style>html,body{margin:0;background:#0b0d12;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}#m{padding:28px;min-height:100vh;box-sizing:border-box;font-size:18px;line-height:1.6}</style></head><body><div id="m">Face Link CV を起動しています…</div><script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script><script>(async()=>{const m=document.getElementById('m');try{if(!window.pako)throw new Error('展開ライブラリを読み込めませんでした');const r=await fetch('./compressed.html?v=2',{cache:'no-store'});if(!r.ok)throw new Error('本体取得エラー '+r.status);const s=await r.text();const x=s.match(/atob\("([A-Za-z0-9+/=]+)"\)/);if(!x)throw new Error('本体データを見つけられませんでした');const b=atob(x[1]);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);const html=new TextDecoder('utf-8').decode(pako.ungzip(u));document.open();document.write(html);document.close()}catch(e){m.textContent='起動に失敗しました: '+(e&&e.message?e.message:String(e))}})();</script></body></html>
